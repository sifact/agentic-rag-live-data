[project]
name = "agentic-rag-live-data"
version = "0.1.0"
description = "Agentic RAG over live sources (Gmail, Notion, Jira via MCP): plans sub-questions, calls tools, collects evidence and answers with citations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rag"]
